name: Test

on:
  workflow_dispatch:
    inputs:
      previous-run-id:
        description: "Previous run id to have the testing task retry failed tests"
        required: false
        type: string
      workflow-retry-count:
        type: choice
        description: "Counter for workflow retry attempts"
        default: '0'
        options:
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

  repository_dispatch:
    types: [ test-main-1, test-main-2, test-main-3, test-main-4, test-main-5 ]
    inputs:
      previous-run-id:
        description: "Previous run id to have the testing task retry failed tests"
        type: string
        required: true
      workflow-retry-count:
        description: "Counter for workflow retry attempts"
        type: string
        required: true


env:
  BRANCH: ${{ github.event.ref || 'main'  }} # default branch for other trigger than 'workflow_dispatch'
  PREVIOUS_RUN_ID: ${{ inputs.previous-run-id || inputs.previousRunId || 'false' }} # default previous run id for other trigger than 'workflow_dispatch'
  WORKFLOW_RETRY_COUNT: ${{ inputs.workflow-retry-count || inputs.previousRunId }} # default retry count for other trigger than 'workflow_dispatch'
  WORKFLOW_RETRY_LIMIT: 5


jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 'Download e2e-retry-props'
        if: ${{ env.PREVIOUS_RUN_ID != 'false' }}
        uses: actions/download-artifact@v4
        with:
          name: e2e-retry-props
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PREVIOUS_RUN_ID }}
          path: e2e-retry-props.txt

      - name: 'Read e2e retry props'
        if: ${{ env.PREVIOUS_RUN_ID != 'false' }}
        run: |
          echo "Reading e2e-retry-props.txt file..."
          cat e2e-retry-props.txt
          echo "Setting environment variables from e2e-retry-props.txt..."
          while IFS='=' read -r key value; do
            echo "Setting $key to $value"
            echo "$key=$value" >> $GITHUB_ENV
          done < e2e-retry-props.txt

      - name: test-failure
        run: |
          echo "env.BRANCH: ${{ env.BRANCH }}"
          echo "env.PREVIOUS_RUN_ID: ${{ env.PREVIOUS_RUN_ID }}"
          echo "env.WORKFLOW_RETRY_COUNT: ${{ env.WORKFLOW_RETRY_COUNT }}"
          echo "inputs.previous-run-id: ${{ inputs.previous-run-id }}"
          echo "inputs.workflow-retry-count: ${{ inputs.workflow-retry-count }}"
          echo "inputs.previousRunId: ${{ inputs.previousRunId }}"
          echo "inputs.workflowRetryCount: ${{ inputs.workflowRetryCount }}"
          echo "Displaying all GitHub event parameters:"
          for var in $(env | grep GITHUB_); do
            echo "$var"
          done
          echo "${{ toJson(github.event) }}"
          echo "Run in failure..."
          # Simulating a test failure for demonstration purposes
          exit 1

  check-test-results:
    if: ${{ always() && contains(needs.run-tests.result,'failure') }}
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - name: 'Retry Check'
        id: check
        run: |
          echo "Current workflow retry count: ${{ env.WORKFLOW_RETRY_COUNT }}"
          echo "Workflow retry limit: ${{ env.WORKFLOW_RETRY_LIMIT }}"
          if [ ${{ env.WORKFLOW_RETRY_COUNT }} -lt ${{ env.WORKFLOW_RETRY_LIMIT }} ]; then
            echo "Retry limit of ${{ env.WORKFLOW_RETRY_LIMIT }} not reached. Triggering workflow rerun."
            echo "retryCount=$(( ${{ env.WORKFLOW_RETRY_COUNT }} + 1 ))" >> $GITHUB_OUTPUT
            echo "isRetry=true" >> $GITHUB_OUTPUT
            echo "runId=${{ github.run_id }}" >> $GITHUB_OUTPUT
          else
            echo "Retry limit reached. Not retrying the workflow."
            echo "run_retry=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: ${{ steps.check.outputs.run_retry == 'true' }}
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows/elion-e2e-test-rerun.yml

    outputs:
      isRetry: ${{ steps.check.outputs.isRetry }}
      runId: ${{ steps.check.outputs.runId }}
      retryCount: ${{ steps.check.outputs.retryCount }}

  properties-logging:
    needs: [check-test-results, run-tests]
    if: ${{ always() && contains(needs.run-tests.result,'failure') && needs.check-test-results.outputs.isRetry == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: 'Logging retry properties'
        run: |
          echo "retryCount: ${{ needs.check-test-results.outputs.retryCount }}"
          echo "isRetry: ${{ needs.check-test-results.outputs.isRetry }}"
          echo "runId:${{ needs.check-test-results.outputs.runId }}"

      - name: 'Write e2e retry props to file'
        run: |
          echo "RETRY_COUNT=${{ needs.check-test-results.outputs.retryCount }}" >> e2e-retry-props.txt
          echo "IS_RETRY=${{ needs.check-test-results.outputs.isRetry }}" >> e2e-retry-props.txt
          echo "PREVIOUS_RUN_ID=${{ needs.check-test-results.outputs.runId }}" >> e2e-retry-props.txt
          echo "BRANCH=${{ github.event.ref }}" >> e2e-retry-props.txt

      - name: 'Upload retry properties artifact'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-retry-props
          path: e2e-retry-props.txt
          overwrite: true

  rerun:
    needs: check-test-results
    if: ${{ always() && needs.check-test-results.outputs.run_retry == 'true' }}
    uses: './.github/workflows/test-main-rerun.yml'
    with:
      previous-run-id: ${{ needs.check-test-results.outputs.run_id }}
      workflow-retry-count: ${{ needs.check-test-results.outputs.new_count }}
    secrets: inherit